[project]
id = "quectop-hub"
description = "Dashboard and data collector for quectop probes"
version_file = "VERSION"
maintainer = "toxdes <hi@toxdes.com>"
homepage = "https://github.com/toxdes/quectop"
license = "MIT"

[build]
output_dir = "dist"
platforms = ["linux/amd64", "linux/arm64"]

[[package.deb.assets]]
source = "LICENSE"
dest = "/usr/share/doc/quectop-hub/copyright"

[[package.deb.assets]]
source = "web/icons/LICENSE"
dest = "/usr/share/doc/quectop-hub/tabler-icons.LICENSE"

[[package.rpm.assets]]
source = "LICENSE"
dest = "/usr/share/licenses/quectop-hub/LICENSE"

[[package.rpm.assets]]
source = "web/icons/LICENSE"
dest = "/usr/share/licenses/quectop-hub/tabler-icons.LICENSE"

[[package.archive.assets]]
source = "LICENSE"
dest = "/usr/share/licenses/quectop-hub/LICENSE"

[[package.archive.assets]]
source = "web/icons/LICENSE"
dest = "/usr/share/licenses/quectop-hub/tabler-icons.LICENSE"

[deb]
helper_image = "docker.io/toxdes/yesb-apt-helper@sha256:ec2452ba31dcec97924f061352ed84626ee890d3b88f33bddf6eb22fe8eb635f"
architectures = ["amd64", "arm64"]
depends = ["quectop"]

[rpm]
helper_image = "docker.io/toxdes/yesb-rpm-helper@sha256:ee8caaff1fd1434b1414e09b5fce00572d3199b622f6ba39f73a3934117e221c"
requires = ["quectop"]

[aur]
srcinfo_helper_image = "docker.io/toxdes/yesb-aur-helper@sha256:e0b511b58baf4d1e281b154a50fd15125f886472dc7166a4aa578cb7a40435ea"
source_pkgbuild = "PKGBUILD.source"
git_pkgbuild = "PKGBUILD"
depends = ["quectop"]

[hosting]
public_base_url = "https://packages.toxdes.com"

[hosting.apt]
origin = "toxdes"
label = "Toxdes"
