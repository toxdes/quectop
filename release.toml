[project]
id = "quectop"
description = "Lightweight Linux resource monitor"
version_file = "VERSION"
maintainer = "toxdes <hi@toxdes.com>"
homepage = "https://github.com/toxdes/quectop"
license = "MIT"

[build]
output_dir = "dist/packages"
platforms = ["linux/amd64", "linux/arm64"]

[[release.artifacts]]
name = "quectop_{version}_amd64.tar.gz"
platform = "linux"
architecture = "x86_64"

[[release.artifacts]]
name = "quectop_{version}_arm64.tar.gz"
platform = "linux"
architecture = "arm64"

[[release.artifacts]]
name = "quectop-hub_{version}_amd64.tar.gz"
platform = "linux"
architecture = "x86_64"

[[release.artifacts]]
name = "quectop-hub_{version}_arm64.tar.gz"
platform = "linux"
architecture = "arm64"

[[package.deb.assets]]
source = "LICENSE"
dest = "/usr/share/doc/quectop/copyright"

[[package.rpm.assets]]
source = "LICENSE"
dest = "/usr/share/licenses/quectop/LICENSE"

[[package.archive.assets]]
source = "LICENSE"
dest = "/usr/share/licenses/quectop/LICENSE"

[deb]
helper_image = "docker.io/toxdes/yesb-apt-helper@sha256:ec2452ba31dcec97924f061352ed84626ee890d3b88f33bddf6eb22fe8eb635f"
architectures = ["amd64", "arm64"]

[rpm]
helper_image = "docker.io/toxdes/yesb-rpm-helper@sha256:ee8caaff1fd1434b1414e09b5fce00572d3199b622f6ba39f73a3934117e221c"

[aur]
srcinfo_helper_image = "docker.io/toxdes/yesb-aur-helper@sha256:e0b511b58baf4d1e281b154a50fd15125f886472dc7166a4aa578cb7a40435ea"
source_pkgbuild = "packaging/PKGBUILD.source"
git_pkgbuild = "packaging/PKGBUILD"

[hosting]
public_base_url = "https://packages.toxdes.com"

[hosting.apt]
origin = "toxdes"
label = "Toxdes"
